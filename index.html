<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>KPIs do L'Essence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/lessence-kpi-dashboard/assets/index-CqFR0rMX.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('root').innerHTML = '<div style="padding:20px;color:red;font-family:monospace">ERRO: ' + e.message + '<br>Arquivo: ' + e.filename + '<br>Linha: ' + e.lineno + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('root').innerHTML = '<div style="padding:20px;color:red;font-family:monospace">PROMISE ERROR: ' + (e.reason?.message || e.reason) + '</div>';
      });
    </script>
    <script type="module" src="/lessence-kpi-dashboard/assets/index-Bg62Mwo7.js"></script>
  </body>
</html>
